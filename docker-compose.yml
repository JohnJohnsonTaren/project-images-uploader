services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image_uploader_app
    ports:
      - "8000:8000"
    volumes:
      - images:/images
      - logs:/logs
    networks:
      - image-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: image_uploader_nginx
    ports:
      - "8080:80"
    volumes:
      - images:/images:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - image-network
    restart: unless-stopped

volumes:
  images:
  logs:

networks:
  image-network:
    driver: bridge